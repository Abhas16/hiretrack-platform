# CI for the React web app: lint, format, typecheck, tests, then build the Docker image
# for amd64 (laptops, x86 nodes) and arm64 (AWS Graviton nodes). Nothing is pushed yet (M6).
name: web

on:
  # Every PR starts this workflow (no `paths` here), so its required check always reports.
  # The `changes` job below decides whether the real jobs run; a job skipped by `if:` counts as passed.
  pull_request:
  push:
    branches: [main]
    paths:   # on main nothing is required, so skipping whole runs here just saves minutes
      - "services/web/**"
      - ".github/workflows/web.yml"

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that's still going.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which folders did this PR/push touch? Outputs web=true/false for the jobs below.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read          # paths-filter lists a PR's changed files through the GitHub API
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'services/web/**'
              - '.github/workflows/web.yml'

  checks:
    name: web checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"                                  # same major as the Dockerfile build stage (node:26-alpine)
          cache: npm                                          # cache ~/.npm between runs
          cache-dependency-path: services/web/package-lock.json   # new cache when the lockfile changes

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  image:
    name: web image (${{ matrix.arch }})
    needs: checks                     # only build images for code that passed the checks
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm  # native ARM runner: no slow emulation
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/web
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true                 # keep the image in the local daemon for scanning
          tags: hiretrack-web:${{ github.sha }}
          # Reuse Docker layers between CI runs (stored in the GitHub Actions cache).
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

      # Scan the image just built (from the local Docker daemon). A CRITICAL vulnerability that
      # has a fix available fails the job; unfixed ones are reported but can't be acted on yet.
      - name: trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 hiretrack-web:${{ github.sha }}
          && docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 hiretrack-web:${{ github.sha }}

      # SBOM = the list of every package inside the image. Kept as a build artifact, so when a
      # new CVE is announced you can check which images contain the package without rebuilding.
      - name: SBOM (SPDX JSON)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
          hiretrack-web:${{ github.sha }} -o spdx-json=/out/sbom.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web-${{ matrix.arch }}
          path: sbom.spdx.json
          retention-days: 30

  # The ONE check that branch protection requires for this workflow.
  # Runs even when the jobs above were skipped, and fails only if one of them failed or was cancelled.
  ok:
    name: web-ok
    needs: [changes, checks, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: fail if any web job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: 'echo "web CI ok (changes=${{ needs.changes.outputs.web }})"'
