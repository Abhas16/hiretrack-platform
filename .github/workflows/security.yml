# Repo-wide security checks (images are scanned in api.yml / web.yml right after they're built):
#   gitleaks   secrets committed anywhere in git history (keys, tokens, passwords)
#   trivy fs   known CVEs in uv.lock / package-lock.json, and misconfigurations in the
#              Dockerfiles, Helm chart and Kubernetes manifests
# Scanner images are pinned by digest: a moved tag can't change what runs in CI.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # Mondays: new CVEs appear even when the code doesn't change

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # full history: a secret deleted later is still leaked
      - name: gitleaks (git history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  trivy-fs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Print everything HIGH+ for the reviewer (accepted risks included, so they stay visible),
      # then fail only on CRITICAL vulnerabilities (with a fix available) and HIGH+
      # misconfigurations that are not documented accepted risks in .trivyignore.yaml.
      - name: report (HIGH, CRITICAL)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --quiet --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 /repo
      - name: gate
        run: |
          IMAGE=aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          docker run --rm -v "$PWD:/repo:ro" $IMAGE fs --quiet --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 /repo
          docker run --rm -v "$PWD:/repo:ro" $IMAGE fs --quiet --scanners misconfig,secret \
            --ignorefile /repo/.trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 /repo
