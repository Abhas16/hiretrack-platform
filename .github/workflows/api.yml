# HireTrack Python CI (API + workers share one uv workspace): lint, typecheck, unit + integration
# tests, then build all five images for amd64 and arm64.
name: api

on:
  # Every PR starts this workflow (no `paths` here), so its required check always reports.
  # The `changes` job below decides whether the real jobs run; a job skipped by `if:` counts as passed.
  pull_request:
  push:
    branches: [main]
    paths:   # on main nothing is required, so skipping whole runs here just saves minutes
      - "services/api/**"
      - "services/job-scout/**"
      - "services/match-scorer/**"
      - "services/reminder-worker/**"
      - "services/triage-bot/**"
      - "libs/**"
      - "config/**"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which folders did this PR/push touch? Outputs api=true/false for the jobs below.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read          # paths-filter lists a PR's changed files through the GitHub API
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'services/job-scout/**'
              - 'services/match-scorer/**'
              - 'services/reminder-worker/**'
              - 'services/triage-bot/**'
              - 'libs/**'
              - 'config/**'
              - 'docker/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/api.yml'

  checks:
    name: api checks
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs uv + Python 3.12 and caches downloaded packages (keyed on uv.lock).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # --frozen: fail if uv.lock is out of date instead of silently changing it.
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy libs/hiretrack_common/src services/api/src services/job-scout/src
          services/match-scorer/src services/reminder-worker/src services/triage-bot/src

      - name: unit tests
        run: uv run pytest -m "not integration"

      # testcontainers starts a real Postgres using the Docker that's already on the runner.
      - name: integration tests
        run: uv run pytest -m integration

  image:
    name: ${{ matrix.service }} image (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false             # one broken image shouldn't hide the others' results
      matrix:
        service: [api, job-scout, match-scorer, reminder-worker, triage-bot]
        arch: [amd64, arm64]
        include:                   # adds the runner to every combination with that arch
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Context is the repo ROOT: the images need uv.lock, libs/ and config/ too.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The API has its own Dockerfile (it ships migrations); the workers share one.
          file: ${{ matrix.service == 'api' && 'services/api/Dockerfile' || 'docker/python-service.Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true                 # keep the image in the local daemon for scanning
          tags: hiretrack-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      # Scan the image just built (from the local Docker daemon). A CRITICAL vulnerability that
      # has a fix available fails the job; unfixed ones are reported but can't be acted on yet.
      - name: trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 hiretrack-${{ matrix.service }}:${{ github.sha }}
          && docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 hiretrack-${{ matrix.service }}:${{ github.sha }}

      # SBOM = the list of every package inside the image. Kept as a build artifact, so when a
      # new CVE is announced you can check which images contain the package without rebuilding.
      - name: SBOM (SPDX JSON)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
          hiretrack-${{ matrix.service }}:${{ github.sha }} -o spdx-json=/out/sbom.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}-${{ matrix.arch }}
          path: sbom.spdx.json
          retention-days: 30

  # The ONE check that branch protection requires for this workflow.
  # Runs even when the jobs above were skipped, and fails only if one of them failed or was cancelled.
  ok:
    name: api-ok
    needs: [changes, checks, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: fail if any api job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: 'echo "api CI ok (changes=${{ needs.changes.outputs.api }})"'
