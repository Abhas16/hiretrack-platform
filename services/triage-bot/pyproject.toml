[project]
name = "triage-bot"
version = "0.1.0"
description = "HireTrack triage-bot: turns Alertmanager alerts into GitHub issues with logs, metrics and a probable cause."
requires-python = ">=3.12,<3.13"
dependencies = [
    "hiretrack-common",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "anthropic==1.11.0",
]

[project.scripts]
triage-bot = "triage_bot.__main__:main"

[tool.uv.sources]
hiretrack-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
