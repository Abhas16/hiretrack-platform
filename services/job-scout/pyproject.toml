[project]
name = "job-scout"
version = "0.1.0"
description = "HireTrack job-scout: CronJob that fetches new listings from public job-board APIs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "hiretrack-common",
    "httpx==0.28.1",
]

[project.scripts]
job-scout = "job_scout.__main__:main"

[tool.uv.sources]
hiretrack-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
