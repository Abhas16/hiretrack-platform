# Alembic config. The database URL is NOT here: env.py builds it from DB_* env vars,
# so no password ever lands in a committed file.
# Run from the repo root:  uv run alembic -c services/api/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
