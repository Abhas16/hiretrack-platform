server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # Compress text responses (JS/CSS/JSON are ~70% smaller over the wire).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files (index-DPVHCCKF.js): new content = new name, so cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Runtime config, written at container start by docker/40-runtime-config.sh.
    # /tmp because nginx runs as non-root and can't write into /usr/share/nginx/html.
    # Never cached, or a changed API_BASE_URL wouldn't reach users.
    location = /config.json {
        alias /tmp/config.json;
        add_header Cache-Control "no-cache";
    }

    # Everything else: a real file if it exists, otherwise index.html so React Router can
    # handle /board, /practice/123, ... (SPA fallback). index.html itself is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
