# HireTrack local stack:
#   postgres + redis -> migrate (one-shot) -> api, match-scorer, triage-bot -> web
#   job-scout / reminder-worker (profile "jobs", run on demand like a CronJob)
# Usage (repo root):  docker compose up --build        Stop: docker compose down
# Secrets come from the .env file in the repo root (git-ignored), never from this file.
name: hiretrack

# Reusable blocks ("x-" = ignored by compose itself; "&name" saves it, "*name" reuses it).
x-api-image: &api-image
  build:
    context: .                          # repo root: the API image needs libs/ and uv.lock
    dockerfile: services/api/Dockerfile
  image: hiretrack-api:dev              # migrate and api share this one image

# The four Python workers share one Dockerfile; the SERVICE build arg picks the package.
x-worker-build: &worker-build
  context: .
  dockerfile: docker/python-service.Dockerfile

x-queue-env: &queue-env
  QUEUE_BACKEND: redis
  REDIS_URL: redis://redis:6379/0

x-db-env: &db-env
  DB_HOST: postgres                     # the service name below, NOT localhost
  DB_PORT: "5432"                       # container port, not the laptop port
  DB_NAME: ${DB_NAME:?set DB_NAME in .env}
  DB_USER: ${DB_USER:?set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  DB_SSLMODE: disable

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"                     # 5432 on this laptop is taken by a Windows Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy      # postgres accepts connections
    restart: "no"                       # runs once, then exits

  api:
    <<: *api-image
    environment:
      <<: *db-env
      APP_ENV: local
      HOST: 0.0.0.0                     # listen on all interfaces inside the container
      LOG_FORMAT: json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:8080   # the web container, as the browser sees it
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully   # tables exist (exit code 0)
    restart: unless-stopped

  # ---- Smart Apply ---------------------------------------------------------------------
  # Locally the queue is Redis Streams; in AWS it is SQS (QUEUE_BACKEND=sqs). Same code.
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--appendonly", "yes"]   # keep queued messages across restarts
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  match-scorer:
    build:
      <<: *worker-build
      args: { SERVICE: match-scorer }
    image: hiretrack-match-scorer:dev
    environment:
      <<: [*db-env, *queue-env]
      LOG_FORMAT: json
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "9100:9100"                     # /healthz /readyz /metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s              # time to finish the current message after SIGTERM
    restart: unless-stopped

  # CronJobs in Kubernetes; here you run them on demand:
  #   docker compose run --rm job-scout        docker compose run --rm reminder-worker
  job-scout:
    build:
      <<: *worker-build
      args: { SERVICE: job-scout }
    image: hiretrack-job-scout:dev
    profiles: ["jobs"]                  # not started by `docker compose up`
    environment:
      <<: [*db-env, *queue-env]
      LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  reminder-worker:
    build:
      <<: *worker-build
      args: { SERVICE: reminder-worker }
    image: hiretrack-reminder-worker:dev
    profiles: ["jobs"]
    environment:
      <<: *db-env
      LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  triage-bot:
    build:
      <<: *worker-build
      args: { SERVICE: triage-bot }
    image: hiretrack-triage-bot:dev
    environment:
      LOG_FORMAT: json
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-local-dev-webhook-token-123456}
      GITHUB_REPO: ${GITHUB_REPO:-}     # both empty = dry run: issues are only logged
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8081:8080"                     # 8080 on the laptop is the web container
    restart: unless-stopped

  web:
    build:
      context: services/web
    image: hiretrack-web:dev
    environment:
      API_BASE_URL: http://localhost:8000   # the BROWSER calls this, from your laptop
      ENVIRONMENT: docker
      VERSION: dev
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy      # uses the HEALTHCHECK in the API Dockerfile
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
