[project]
name = "hiretrack-common"
version = "0.1.0"
description = "Shared code for HireTrack services: settings, JSON logging, ORM models, domain rules."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy==2.0.41",
    "psycopg[binary]==3.2.9",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "prometheus-client==0.22.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
