[project]
name = "hiretrack-common"
version = "0.1.0"
description = "Shared code for HireTrack services: settings, JSON logging, ORM models, domain rules."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "prometheus-client==0.22.1",
    "redis==8.1.0",
    "pyyaml==6.0.3",
    "boto3==1.43.118",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
