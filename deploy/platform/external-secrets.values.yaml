# External Secrets Operator (chart 2.14.0), namespace external-secrets.
# Copies values from AWS SSM Parameter Store into Kubernetes Secrets and keeps them in sync.
# AWS credentials: Pod Identity association for external-secrets/external-secrets, which may
# only read /hiretrack/<env>/* (infra/terraform/envs/dev/pod-identity.tf).
installCRDs: true

serviceAccount:
  create: true
  name: external-secrets               # must match the Pod Identity association

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 192Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
