# Secrets the monitoring stack expects (see kube-prometheus-stack.values.yaml), built from SSM.
#   triage-bot-webhook  Alertmanager sends this bearer token to the triage-bot
#   grafana-admin       Grafana's admin login
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: triage-bot-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target:
    name: triage-bot-webhook
  data:
    - secretKey: token
      remoteRef: { key: /hiretrack/dev/app/WEBHOOK_TOKEN }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target:
    name: grafana-admin
    # A fixed key next to the ones from SSM.
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: /hiretrack/dev/grafana/admin-password }
