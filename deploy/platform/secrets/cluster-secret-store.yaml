# Where External Secrets reads from: SSM Parameter Store in this region. No `auth` block =
# the operator's own AWS credentials (EKS Pod Identity), limited to /hiretrack/<env>/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
