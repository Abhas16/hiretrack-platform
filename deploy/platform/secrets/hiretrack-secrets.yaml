# The app's Secret (`existingSecret` in the chart), built from SSM by External Secrets.
# It lives here, not in the app chart, so it exists BEFORE the chart's migrate Job runs:
# that Job is a PreSync hook, which runs before any normal resource of the same app.
apiVersion: v1
kind: Namespace
metadata:
  name: hiretrack
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hiretrack-secrets
  namespace: hiretrack
spec:
  refreshInterval: 1h          # a value changed in SSM reaches the Secret within an hour
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target:
    name: hiretrack-secrets
  # Each entry must exist in SSM, or the whole Secret fails to sync. To add the optional
  # GITHUB_TOKEN / ANTHROPIC_API_KEY: put them in SSM first (see infra/terraform/envs/dev/
  # secrets.tf), then add the same kind of entry here.
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: /hiretrack/dev/app/DB_PASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: /hiretrack/dev/app/JWT_SECRET }
    - secretKey: WEBHOOK_TOKEN
      remoteRef: { key: /hiretrack/dev/app/WEBHOOK_TOKEN }
