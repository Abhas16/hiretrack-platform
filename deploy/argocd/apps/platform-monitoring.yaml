# Observability add-ons. Sync waves order them: CRD owners first (-2), then what uses them.
# Each app uses two sources: the upstream chart, and this repo (ref: values) for our values file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"   # installs the ServiceMonitor/PrometheusRule CRDs
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: hiretrack
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles: [$values/deploy/platform/kube-prometheus-stack.values.yaml]
    - repoURL: https://github.com/Abhas16/hiretrack-platform.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      # The Prometheus CRDs are too big for client-side apply's last-applied annotation.
      - ServerSideApply=true
---
