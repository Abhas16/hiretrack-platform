# AWS integration add-ons. They need IAM roles, which Terraform creates and binds with EKS Pod
# Identity associations (infra/terraform/envs/dev/pod-identity.tf), so nothing AWS-specific
# (no role ARN, no account ID) is needed in these manifests.
# Wave -4: before everything else, because the monitoring Secrets (wave -3) need External
# Secrets, and the app's Ingress / ScaledObject (wave 1) need the LB controller and KEDA.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: hiretrack
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.2
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles: [$values/deploy/platform/aws-load-balancer-controller.values.yaml]
    - repoURL: https://github.com/Abhas16/hiretrack-platform.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [RespectIgnoreDifferences=true]
  # The chart generates a new webhook TLS cert on every render; don't treat that as drift.
  ignoreDifferences:
    - kind: Secret
      name: aws-load-balancer-tls
      jsonPointers: [/data]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: hiretrack
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles: [$values/deploy/platform/external-secrets.values.yaml]
    - repoURL: https://github.com/Abhas16/hiretrack-platform.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
  # The operator's cert-controller writes its own CA into the webhooks and CRDs at runtime.
  # Without this, selfHeal would keep reverting it to the empty value from the chart.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions: [".spec.conversion.webhook.clientConfig.caBundle"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: hiretrack
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.0
      helm:
        releaseName: keda
        valueFiles: [$values/deploy/platform/keda.values.yaml]
    - repoURL: https://github.com/Abhas16/hiretrack-platform.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: keda }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
  # KEDA generates its own certificates and patches their CA in at runtime (same reason as above).
  ignoreDifferences:
    - group: apiregistration.k8s.io
      kind: APIService
      jsonPointers: [/spec/caBundle]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
---
# The SSM-backed ClusterSecretStore + the Secrets the monitoring stack needs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # after the External Secrets CRDs, before Grafana/Alertmanager
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: hiretrack
  source:
    repoURL: https://github.com/Abhas16/hiretrack-platform.git
    targetRevision: main
    path: deploy/platform/secrets
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry:                       # the ESO webhook may need a few seconds after wave -4
      limit: 5
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
