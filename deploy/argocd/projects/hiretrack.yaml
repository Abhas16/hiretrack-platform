# AppProject = the guard rails for every Application below: which Git/Helm repos they may
# pull from and which namespaces they may deploy into. An app pointing anywhere else is refused.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hiretrack
  namespace: argocd
spec:
  description: HireTrack app and its platform add-ons
  sourceRepos:
    - https://github.com/Abhas16/hiretrack-platform.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://argoproj.github.io/argo-helm
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://aws.github.io/eks-charts
    - https://charts.external-secrets.io
    - https://kedacore.github.io/charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: hiretrack }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: argo-rollouts }
    - { server: https://kubernetes.default.svc, namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: keda }
  # Cluster-wide objects the add-ons need (CRDs, RBAC, webhooks, ...). The app chart needs none.
  clusterResourceWhitelist:
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: apiregistration.k8s.io, kind: APIService }
    - { group: "", kind: Namespace }
    - { group: networking.k8s.io, kind: IngressClass }               # "alb"
    - { group: elbv2.k8s.aws, kind: IngressClassParams }
    - { group: external-secrets.io, kind: ClusterSecretStore }       # aws-ssm
    - { group: external-secrets.io, kind: ClusterExternalSecret }
    - { group: external-secrets.io, kind: ClusterGenerator }
    - { group: keda.sh, kind: ClusterTriggerAuthentication }
  orphanedResources:
    warn: true                   # show objects in these namespaces that no app manages
