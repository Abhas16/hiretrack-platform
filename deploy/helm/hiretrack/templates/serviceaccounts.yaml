{{- /* One ServiceAccount per component (least privilege with EKS Pod Identity). */ -}}
{{- range $name := list "api" "web" "match-scorer" "job-scout" "reminder-worker" "triage-bot" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hiretrack-{{ $name }}
  labels:
    {{- include "hiretrack.componentLabels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- with $.Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods don't call the Kubernetes API, so don't mount a token they'd never use.
automountServiceAccountToken: false
{{- end }}
