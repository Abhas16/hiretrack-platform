apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "hiretrack.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- if or .Values.files.sourcesYaml .Values.files.skillsYaml }}
---
# Overrides for the files baked into the images (mounted at /app/config).
# Both keys are always written, so mounting the folder never hides one of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-files
  labels:
    {{- include "hiretrack.labels" . | nindent 4 }}
data:
  sources.yaml: |
    {{- required "files.sourcesYaml is required when overriding config files" .Values.files.sourcesYaml | nindent 4 }}
  skills.yaml: |
    {{- required "files.skillsYaml is required when overriding config files" .Values.files.skillsYaml | nindent 4 }}
{{- end }}
