{{- if .Values.web.enabled }}
{{- $name := "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiretrack-{{ $name }}
  labels:
    {{- include "hiretrack.componentLabels" (dict "root" . "name" $name) | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "hiretrack.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hiretrack.componentLabels" (dict "root" . "name" $name) | nindent 8 }}
    spec:
      serviceAccountName: hiretrack-{{ $name }}
      securityContext:
        # nginx-unprivileged runs as UID 101.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "hiretrack.image" (dict "root" . "repo" "hiretrack-web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.web.port }} }
          env:
            # Written into /config.json at start-up, so one image works in every environment.
            # Default: "" = same origin when behind the Ingress (the browser calls the host it
            # loaded the app from), else localhost for a local cluster without an Ingress.
            {{- $default := ternary "" "http://localhost:8000" .Values.ingress.enabled }}
            - { name: API_BASE_URL, value: {{ .Values.web.apiBaseUrl | default $default | quote }} }
            - { name: ENVIRONMENT, value: {{ .Values.config.APP_ENV | quote }} }
            - { name: VERSION, value: {{ include "hiretrack.tag" . | quote }} }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "hiretrack.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # nginx writes its pid, temp files and the runtime config.json here.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hiretrack-{{ $name }}
  labels:
    {{- include "hiretrack.componentLabels" (dict "root" . "name" $name) | nindent 4 }}
spec:
  selector:
    {{- include "hiretrack.selectorLabels" (dict "name" $name) | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hiretrack-{{ $name }}
  labels:
    {{- include "hiretrack.componentLabels" (dict "root" . "name" $name) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hiretrack.selectorLabels" (dict "name" $name) | nindent 6 }}
{{- end }}
